global:
  resolve_timeout: 5m

route:
  receiver: padrao
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critico
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: atencao
    - matchers:
        - severity = "info"
      receiver: silencioso

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname']
  - source_matchers:
      - severity = "warning"
    target_matchers:
      - severity = "info"
    equal: ['alertname']

receivers:
  - name: padrao
  - name: critico
  - name: atencao
  - name: silencioso
