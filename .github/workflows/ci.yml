name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [sidecar, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build imagem
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sentinel-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Scan de vulnerabilidade (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/sentinel-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push imagem
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/sentinel-${{ matrix.service }}:${{ github.sha }}
