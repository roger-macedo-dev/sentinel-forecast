name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem a implantar (SHA do commit, ver no GHCR)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instalar SDK e plugin de autenticação do GKE
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Obter credenciais do cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Atualizar tags das imagens
        run: |
          sed -i "s|ghcr.io/roger-macedo-dev/sentinel-sidecar:.*|ghcr.io/roger-macedo-dev/sentinel-sidecar:${{ inputs.image_tag }}|" k8s/sidecar.yaml
          sed -i "s|ghcr.io/roger-macedo-dev/sentinel-api:.*|ghcr.io/roger-macedo-dev/sentinel-api:${{ inputs.image_tag }}|" k8s/api.yaml
          sed -i "s|ghcr.io/roger-macedo-dev/sentinel-remediador:.*|ghcr.io/roger-macedo-dev/sentinel-remediador:${{ inputs.image_tag }}|" k8s/remediador.yaml

      - name: Calcular checksums das configs
        run: |
          CHECKSUM_PROM=$(sha256sum k8s/prometheus-config.yaml | cut -c1-16)
          sed -i "s|config-checksum: .*|config-checksum: \"$CHECKSUM_PROM\"|" k8s/prometheus.yaml
          CHECKSUM_GRAFANA=$(cat k8s/grafana-datasources-configmap.yaml k8s/grafana-dashboards-provider-configmap.yaml k8s/grafana-dashboards-configmap.yaml | sha256sum | cut -c1-16)
          sed -i "s|config-checksum: .*|config-checksum: \"$CHECKSUM_GRAFANA\"|" k8s/grafana.yaml
          CHECKSUM_AM=$(sha256sum k8s/alertmanager-configmap.yaml | cut -c1-16)
          sed -i "s|config-checksum: .*|config-checksum: \"$CHECKSUM_AM\"|" k8s/alertmanager.yaml
          CHECKSUM_SIDECAR=$(sha256sum k8s/sidecar-config-configmap.yaml | cut -c1-16)
          sed -i "s|config-checksum: .*|config-checksum: \"$CHECKSUM_SIDECAR\"|" k8s/sidecar.yaml

      - name: Deploy no cluster
        run: kubectl apply -f k8s/
