apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
# ClusterRole, e nao Role: a descoberta de Pods percorre o cluster inteiro.
# Ainda assim e somente leitura, e limitada a Pods e aos seus logs — nao alcanca
# Secrets, ConfigMaps nem qualquer recurso mutavel.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: default
roleRef:
  kind: ClusterRole
  name: alloy
  apiGroup: rbac.authorization.k8s.io

