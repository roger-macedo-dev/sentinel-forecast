apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediador
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediador
rules:
  # reiniciar e escalar Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # verificar se o alvo e gerenciado por HPA antes de escalar
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  # limpar Pods em falha
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediador
subjects:
  - kind: ServiceAccount
    name: remediador
roleRef:
  kind: Role
  name: remediador
  apiGroup: rbac.authorization.k8s.io
