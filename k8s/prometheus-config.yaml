apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: node_exporter
        static_configs:
          - targets: ["node-exporter:9100"]
      - job_name: sidecar
        static_configs:
          - targets: ["sidecar:8000"]
      - job_name: postgres_exporter
        static_configs:
          - targets: ["postgres-exporter:9187"]
      - job_name: remediador
        static_configs:
          - targets: ["remediador:8080"]
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - "/etc/prometheus/alert-rules.yml"
  alert-rules.yml: |
    groups:
      - name: sentinel-forecast
        rules:
          - alert: MemoriaPrevisao
            expr: memoria_previsao_percentual > 70
            for: 5m
            labels:
              severity: info
            annotations:
              summary: "Previsao de memoria acima de 70%"
          - alert: MemoriaPrevisao
            expr: memoria_previsao_percentual > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Previsao de memoria acima de 85%"
          - alert: MemoriaPrevisao
            expr: memoria_previsao_percentual > 95
            for: 5m
            labels:
              severity: critical
              target: sidecar
            annotations:
              summary: "Previsao critica de memoria"
